name: Idea
description: Something you'd like Tactile to do, or to do differently.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like Tactile to do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: How it might work, another app that does it well, or a sketch of the change.
